name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            custom_components/tele2/manifest.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          # tele2api pin lives in the manifest — install it from there (single source of truth)
          pip install "$(python -c 'import json; print(json.load(open("custom_components/tele2/manifest.json"))["requirements"][0])')"

      - name: Run tests
        run: pytest -q
